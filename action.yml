name: Workers Doctor
description: Inspect Cloudflare Worker stacks, environments, and local or remote bindings.
author: Loke

branding:
  icon: activity
  color: orange

inputs:
  path:
    description: Worker project or monorepo directory to inspect.
    required: false
    default: .
  environment:
    description: Named Workers environment to resolve.
    required: false
    default: ""
  strict:
    description: Boolean string; true fails when warnings are found.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        package-manager-cache: false
    - name: Run Workers Doctor
      shell: bash
      env:
        WORKERS_DOCTOR_PATH: ${{ inputs.path }}
        WORKERS_DOCTOR_ENVIRONMENT: ${{ inputs.environment }}
        WORKERS_DOCTOR_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        args=("inspect" "$WORKERS_DOCTOR_PATH" "--github")
        if [[ -n "$WORKERS_DOCTOR_ENVIRONMENT" ]]; then
          args+=("--env" "$WORKERS_DOCTOR_ENVIRONMENT")
        fi
        case "$WORKERS_DOCTOR_STRICT" in
          true) args+=("--strict") ;;
          false) ;;
          *)
            printf '%s\n' "::error title=Invalid Workers Doctor input::strict must be true or false"
            exit 2
            ;;
        esac
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
