name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify committed CLI bundle
        run: git diff --exit-code -- dist
      - name: Smoke test local Action
        uses: ./
        with:
          path: tests/fixtures/healthy
          environment: staging
          strict: true
      - name: Inspect test stack
        run: node dist/cli.js tests/fixtures/healthy --env staging --github
