name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify committed CLI bundle
        run: git diff --exit-code -- dist
      - name: Smoke test local Action
        uses: ./
        with:
          path: tests/fixtures/healthy
          environment: staging
          strict: true
      - name: Inspect test stack
        run: node dist/cli.js tests/fixtures/healthy --env staging --github

  npm-artifact:
    name: Node 20 npm artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Pack, install, and run published shape
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tarball="$RUNNER_TEMP/workers-doctor-${version}.tgz"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tarball"
          test "$(node -p "Object.keys(require('./node_modules/workers-doctor/package.json').dependencies || {}).length")" = "0"
          test "$(./node_modules/.bin/workers-doctor --version)" = "$version"
          ./node_modules/.bin/workers-doctor inspect "$GITHUB_WORKSPACE/tests/fixtures/healthy" --env staging --github --strict
